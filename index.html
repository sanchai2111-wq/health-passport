:root{
  --paper:#F7F0DE;
  --paper-dark:#EAE0C2;
  --paper-edge:#DDCE9E;
  --ink:#1F3D3B;
  --ink-soft:#3E5C58;
  --gold:#B8862E;
  --gold-soft:#D9A94B;
  --white:#FFFDF7;
  --zone-ltc:#C97A2B;
  --zone-kids:#C4483A;
  --zone-env:#3F7D52;
  --zone-mental:#5B4B8A;
  --danger:#B33B3B;
  --radius:14px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Sarabun',sans-serif;
  background:
    radial-gradient(circle at 15% 10%, rgba(184,134,46,0.08), transparent 40%),
    radial-gradient(circle at 85% 90%, rgba(63,125,82,0.08), transparent 40%),
    var(--paper);
  color:var(--ink);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.display{font-family:'Mitr',sans-serif;}
button{font-family:'Sarabun',sans-serif;cursor:pointer;}
::selection{background:var(--gold-soft);color:var(--white);}

#app{max-width:760px;margin:0 auto;padding:20px 16px 60px;}

/* ---------- header / passport cover feel ---------- */
.topband{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 4px 18px;border-bottom:2px dashed var(--paper-edge);margin-bottom:18px;
}
.brand{display:flex;align-items:center;gap:10px;}
.brand-mark{
  width:40px;height:40px;border-radius:50%;
  background:var(--white);
  display:flex;align-items:center;justify-content:center;
  border:2px solid var(--gold-soft);
  overflow:hidden;flex:none;
}
.brand-mark img{width:100%;height:100%;object-fit:contain;padding:2px;}
.brand-text{line-height:1.15;}
.brand-text .t1{font-family:'Mitr';font-size:14px;font-weight:600;color:var(--ink);}
.brand-text .t2{font-size:12px;color:var(--ink-soft);}
.back-btn{
  background:none;border:1px solid var(--ink);color:var(--ink);
  padding:6px 14px;border-radius:999px;font-size:13px;
}
.back-btn:hover{background:var(--ink);color:var(--paper);}

/* ---------- page container = a passport page ---------- */
.page{
  background:var(--white);
  border-radius:var(--radius);
  border:1px solid var(--paper-edge);
  box-shadow:0 1px 0 var(--paper-edge), 0 12px 30px -18px rgba(31,61,59,0.35);
  padding:26px 22px;
  position:relative;
  overflow:hidden;
}
.page::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:6px;
  background:repeating-linear-gradient(180deg, var(--gold-soft) 0 10px, transparent 10px 18px);
  opacity:.5;
}
.eyebrow{
  font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:600;margin-bottom:6px;
}
.page h2{font-size:22px;margin:0 0 4px;color:var(--ink);}
.page p.lead{color:var(--ink-soft);font-size:14px;margin:0 0 20px;}

/* ---------- cover / role select ---------- */
.cover{text-align:center;padding:34px 16px 10px;}
.cover-badge{
  width:112px;height:112px;margin:0 auto 16px;border-radius:50%;
  border:3px solid var(--ink);
  display:flex;align-items:center;justify-content:center;
  background:repeating-conic-gradient(from 0deg, var(--gold-soft) 0deg 6deg, transparent 6deg 18deg);
  position:relative;
}
.cover-badge span{background:var(--white);border-radius:50%;width:96px;height:96px;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.1;padding:6px;overflow:hidden;}
.cover-badge span img{width:100%;height:100%;object-fit:contain;}
.cover h1{font-size:24px;margin:0 0 6px;}
.cover .sub{color:var(--ink-soft);font-size:14px;margin-bottom:6px;}
.cover .muni{font-size:13px;color:var(--gold);font-weight:600;margin-bottom:26px;}

.role-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;text-align:left;}
@media (max-width:480px){.role-grid{grid-template-columns:1fr;}}
.role-card{
  border:1.5px solid var(--paper-edge);border-radius:12px;padding:16px 14px;
  background:var(--white);display:flex;gap:12px;align-items:flex-start;
  transition:transform .15s ease, border-color .15s ease, box-shadow .15s ease;
  text-align:left;width:100%;
}
.role-card:hover{transform:translateY(-2px);border-color:var(--gold-soft);box-shadow:0 10px 20px -14px rgba(31,61,59,0.4);}
.role-ic{
  width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;
  font-size:17px;flex:none;color:var(--white);
}
.role-title{font-family:'Mitr';font-size:14.5px;font-weight:500;color:var(--ink);margin-bottom:2px;}
.role-desc{font-size:12.5px;color:var(--ink-soft);line-height:1.4;}

/* ---------- form elements ---------- */
label{display:block;font-size:13px;color:var(--ink-soft);margin:14px 0 6px;font-weight:500;}
input[type=text],input[type=tel],select{
  width:100%;padding:11px 13px;border-radius:9px;border:1.5px solid var(--paper-edge);
  font-size:15px;font-family:'Sarabun';background:var(--paper);color:var(--ink);
}
input:focus,select:focus{outline:2px solid var(--gold-soft);outline-offset:1px;border-color:var(--gold-soft);}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:12px 20px;border-radius:999px;border:none;font-size:14.5px;font-weight:600;
  font-family:'Sarabun';transition:transform .1s ease, opacity .1s ease;
}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--ink);color:var(--paper);}
.btn-primary:hover{opacity:.9;}
.btn-gold{background:var(--gold);color:var(--white);}
.btn-outline{background:none;border:1.5px solid var(--ink);color:var(--ink);}
.btn-block{width:100%;margin-top:18px;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.hint{font-size:12px;color:var(--ink-soft);margin-top:6px;}
.error-box{background:#FBEAEA;border:1px solid var(--danger);color:var(--danger);padding:10px 12px;border-radius:9px;font-size:13px;margin-top:10px;}
.ok-box{background:#EAF3EC;border:1px solid var(--zone-env);color:#2A5A3A;padding:10px 12px;border-radius:9px;font-size:13px;margin-top:10px;}

/* ---------- QR / passport card ---------- */
.uid-tag{
  font-family:'Mitr';font-weight:600;letter-spacing:.06em;color:var(--ink);
  background:var(--paper);border:1.5px dashed var(--gold);border-radius:8px;
  padding:6px 12px;display:inline-block;font-size:14px;
}
.qr-wrap{
  display:flex;flex-direction:column;align-items:center;gap:10px;
  background:var(--paper);border:1.5px solid var(--paper-edge);border-radius:12px;
  padding:20px;margin:16px 0;
}
.qr-wrap img,.qr-wrap canvas{border-radius:6px;background:var(--white);padding:8px;}
.pname{font-family:'Mitr';font-size:16px;font-weight:500;}
.paffil{font-size:12.5px;color:var(--ink-soft);}

.stamp-row{display:flex;gap:10px;justify-content:center;margin:18px 0 6px;flex-wrap:wrap;}
.stamp-dot{
  width:60px;text-align:center;font-size:11px;color:var(--ink-soft);
}
.stamp-circ{
  width:46px;height:46px;border-radius:50%;margin:0 auto 5px;
  display:flex;align-items:center;justify-content:center;font-size:18px;
  border:2.5px solid var(--paper-edge);color:var(--paper-edge);background:var(--white);
  transition:all .2s ease;
}
.stamp-circ.done{color:var(--white);border-style:solid;}

.progress-line{font-size:13px;color:var(--ink-soft);text-align:center;margin-top:4px;}
.unlock-box{
  margin-top:16px;background:linear-gradient(135deg, var(--gold-soft), var(--gold));
  color:var(--white);border-radius:12px;padding:16px;text-align:center;
}
.unlock-box .t{font-family:'Mitr';font-weight:500;font-size:15px;margin-bottom:4px;}
.unlock-box .d{font-size:12.5px;opacity:.95;}

.survey-box{
  margin-top:14px;padding:14px;border-radius:12px;
  background:var(--paper);border:1.5px solid var(--paper-edge);
}
.survey-title{font-weight:600;font-size:13.5px;color:var(--ink);margin-bottom:4px;}

/* ---------- scanner ---------- */
.zone-select{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
@media(max-width:480px){.zone-select{grid-template-columns:1fr;}}
.zone-btn{
  border:2px solid var(--paper-edge);border-radius:11px;padding:14px;background:var(--white);
  display:flex;align-items:center;gap:10px;font-family:'Mitr';font-size:14px;color:var(--ink);
}
.zone-btn .dot{width:14px;height:14px;border-radius:50%;flex:none;}
.zone-btn.active{border-color:var(--ink);background:var(--paper);}

#reader{border-radius:12px;overflow:hidden;border:1.5px solid var(--paper-edge);}
.scan-status{margin-top:12px;font-size:13px;color:var(--ink-soft);text-align:center;}
.manual-fallback{margin-top:16px;padding-top:16px;border-top:1px dashed var(--paper-edge);}

/* ---------- stamp slam overlay (signature element) ---------- */
.stamp-overlay{
  position:fixed;inset:0;background:rgba(31,61,59,0.55);
  display:flex;align-items:center;justify-content:center;z-index:50;
  animation:fadein .15s ease;
}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.stamp-slam{
  animation:slam .55s cubic-bezier(.2,1.4,.4,1) both;
  filter:url(#inkgrain);
}
@keyframes slam{
  0%{transform:scale(2.2) rotate(-18deg);opacity:0;}
  55%{transform:scale(.94) rotate(-7deg);opacity:1;}
  75%{transform:scale(1.04) rotate(-9deg);}
  100%{transform:scale(1) rotate(-8deg);opacity:1;}
}
.stamp-caption{
  position:fixed;bottom:14%;left:0;right:0;text-align:center;color:var(--white);
  font-family:'Mitr';font-size:15px;z-index:51;animation:fadein .3s ease .2s both;
}

/* ---------- table / admin ---------- */
table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:10px;}
th,td{padding:8px 6px;text-align:left;border-bottom:1px solid var(--paper-edge);}
th{color:var(--ink-soft);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.04em;}
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0 6px;}
@media(min-width:520px){.stat-grid{grid-template-columns:repeat(4,1fr);}}
.stat-card{background:var(--paper);border:1px solid var(--paper-edge);border-radius:10px;padding:12px;text-align:center;}
.stat-num{font-family:'Mitr';font-size:22px;color:var(--ink);}
.stat-lbl{font-size:11px;color:var(--ink-soft);margin-top:2px;}
.mini-badge{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;}
.search-row{display:flex;gap:8px;margin:14px 0;}
.search-row input{flex:1;}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;}

.footnote{font-size:11.5px;color:var(--ink-soft);text-align:center;margin-top:22px;opacity:.8;}
.zone-manager{margin-top:26px;padding-top:18px;border-top:1px dashed var(--paper-edge);}
.zone-manager h3{font-size:15.5px;margin:0 0 10px;font-family:'Mitr';font-weight:500;}
.zone-row{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--paper-edge);font-size:13.5px;}
.zr-name{flex:1;}
.zr-actions{display:flex;gap:12px;flex:none;}
.link-btn{background:none;border:none;color:var(--ink-soft);font-size:12.5px;text-decoration:underline;padding:0;font-family:'Sarabun';}
.link-btn.danger{color:var(--danger);}
.zone-form-box{background:var(--paper);border:1px solid var(--paper-edge);border-radius:10px;padding:14px;margin-top:12px;}
input[type=color]{height:44px;padding:4px;cursor:pointer;}

@media print{
  body *{visibility:hidden;}
  #print-card, #print-card *{visibility:visible;}
  #print-card{position:absolute;top:0;left:0;width:100%;}
}
</style>
</head>

function apiConfigured(){ return SHEET_API_URL && SHEET_API_URL.indexOf('วางลิงก์') === -1; }

async function apiGet(params){
  const url = new URL(SHEET_API_URL);
  Object.keys(params).forEach(k=>url.searchParams.set(k, params[k]));
  url.searchParams.set('_ts', Date.now()); // cache-bust: browsers/proxies otherwise reuse a stale GET response for the same URL
  const res = await fetch(url.toString(), { cache: 'no-store' });
  const data = await res.json();
  if(data && data.error) throw new Error(data.error); // surface server-side errors instead of pretending success
  return data;
}
async function apiPost(body){
  const res = await fetch(SHEET_API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // text/plain avoids a CORS preflight on Apps Script
    body: JSON.stringify(body),
  });
  const data = await res.json();
  if(data && data.error) throw new Error(data.error);
  return data;
}

async function loadZones(){
  try{
    const r = await apiGet({action:'getZones'});
    ZONES = (Array.isArray(r) && r.length) ? r : DEFAULT_ZONES.map(z=>({...z}));
  }catch(e){ ZONES = DEFAULT_ZONES.map(z=>({...z})); }
}
async function persistZones(){ await apiPost({action:'saveZones', data:ZONES, pin: state.adminPin}); }

async function loadProjects(){
  try{
    const r = await apiGet({action:'getProjects'});
    PROJECTS = Array.isArray(r) ? r : [];
  }catch(e){ PROJECTS = []; }
}
async function persistProjects(){ await apiPost({action:'saveProjects', data:PROJECTS, pin: state.adminPin}); }

async function loadConfig(){
  try{
    const c = await apiGet({action:'getConfig'});
    if(c && c.adminPin !== undefined && c.adminPin !== '') ADMIN_PIN = String(c.adminPin).trim();
  }catch(e){}
}

function emptyStamps(){ const o={}; ZONES.forEach(z=>o[z.id]=false); return o; }

// Client-generated UID — no server round trip, no lock queueing at the
// registration desk. Collision odds are negligible for an event this size.
function generateLocalUid(){
  const year = new Date().getFullYear();
  const t = Date.now().toString(36).toUpperCase().slice(-4);
  const r = Math.random().toString(36).toUpperCase().slice(2,4);
  return `KPT${year}-${t}${r}`;
}

async function nextUid(){
  const r = await apiPost({action:'nextUid'});
  return r.uid;
}
async function saveParticipant(p){ await apiPost({action:'saveParticipant', data:p}); }
// Fire-and-forget style append — no lock, no row search, cheapest possible write.
async function appendParticipant(p){ return await apiPost({action:'appendParticipant', data:p}); }
async function getParticipant(uid){
  if(!uid || !uid.trim()) return null;
  const r = await apiGet({action:'getParticipant', uid: uid.trim().toUpperCase()});
  return (r && r.uid) ? r : null;
}
async function listParticipants(){
  const r = await apiGet({action:'listParticipants', pin: state.adminPin || ''});
  const out = Array.isArray(r) ? r : [];
  out.sort((a,b)=> (a.registeredAt||'') < (b.registeredAt||'') ? -1 : 1);
  return out;
}
function stampCount(p){ return ZONES.filter(z=>p.stamps[z.id]).length; }

let zonesLoaded = false, configLoaded = false, projectsLoaded = false;
async function render(){
  if(!apiConfigured()){ return renderSetupNotice(); }
  // Zones/Projects/PIN rarely change mid-event — fetch once per page load and cache,
  // instead of re-fetching on every single screen change (this was the main
  // hidden cost: every navigation was paying for extra network round trips).
  if(!zonesLoaded){ await loadZones(); zonesLoaded = true; }
  if(!projectsLoaded){ await loadProjects(); projectsLoaded = true; }
  if(!configLoaded){ await loadConfig(); configLoaded = true; }
  if(state.view==='cover') return renderCover();
  if(state.view==='register') return renderRegister();
  if(state.view==='registered') return renderRegistered();
  if(state.view==='lookup') return renderLookup();
  if(state.view==='scan') return renderScan();
  if(state.view==='redeem') return renderRedeem();
  if(state.view==='study-register') return renderStudyRegister();
  if(state.view==='study-registered') return renderStudyRegistered();
  if(state.view==='study-reflect') return renderStudyReflect();
  if(state.view==='admin-gate') return renderAdminGate();
  if(state.view==='admin') return renderAdmin();
}

async function submitRegister(){
  const name = document.getElementById('f-name').value.trim();
  const phone = document.getElementById('f-phone').value.trim();
  const affil = document.getElementById('f-affil').value;
  const errBox = document.getElementById('reg-err');
  const btn = document.getElementById('reg-submit-btn');
  if(!name || !phone){
    errBox.innerHTML = `<div class="error-box">กรุณากรอกชื่อ-นามสกุล และเบอร์โทรศัพท์ให้ครบถ้วน</div>`;
    return;
  }
  if(btn) btn.disabled = true;
  errBox.innerHTML = `<div class="hint">กำลังตรวจสอบและลงทะเบียน...</div>`;
  try{
    // ต้องรอเซิร์ฟเวอร์ตอบก่อน (ไม่สร้างรหัสเองที่เครื่องแบบเดิมแล้ว) เพราะต้องเช็คชื่อซ้ำ
    // กับฐานข้อมูลกลางก่อนออกรหัสใหม่ให้เสมอ
    const p = await apiPost({action:'registerParticipant', data:{name, phone, affil}});
    if(p.duplicate){
      errBox.innerHTML = `<div class="error-box">⚠️ ชื่อนี้เคยลงทะเบียนแล้ว<br>ชื่อ: ${p.name}<br>รหัส: <b>${p.uid}</b><br>กรุณาใช้รหัสเดิมนี้ ไม่ต้องลงทะเบียนซ้ำ</div>`;
      if(btn) btn.disabled = false;
      return;
    }
    state.view='registered'; state.lastUid = p.uid; state.pendingParticipant = p;
    render();
  }catch(e){
    errBox.innerHTML = `<div class="error-box">ลงทะเบียนไม่สำเร็จ: ${(e&&e.message)||'ไม่ทราบสาเหตุ'} — ลองใหม่อีกครั้ง</div>`;
    if(btn) btn.disabled = false;
  }
}

async function downloadQR(uid){
  const canvas = document.querySelector('#qrcode canvas');
  if(!canvas){ alert('ไม่พบ QR Code กรุณาลองใหม่อีกครั้ง'); return; }
  // มือถือหลายรุ่น (โดยเฉพาะ iPhone) ดาวน์โหลดไฟล์ผ่านลิงก์ปกติแล้วไปเก็บไว้ที่แอป "ไฟล์"
  // แทนที่จะเข้าอัลบั้มรูปโดยตรง — ใช้ Web Share API ก่อนถ้ารองรับ เพื่อให้กด "บันทึกรูปภาพ"
  // ได้เองจากเมนูแชร์ของเครื่อง เหมือนแชร์รูปจาก Line/Facebook
  try{
    const blob = await new Promise(res => canvas.toBlob(res, 'image/png'));
    const file = new File([blob], uid + '.png', { type: 'image/png' });
    if(navigator.canShare && navigator.canShare({ files: [file] })){
      await navigator.share({ files: [file], title: uid });
      return;
    }
  }catch(e){ /* ผู้ใช้กดยกเลิกการแชร์ หรือเบราว์เซอร์ไม่รองรับ — ใช้ดาวน์โหลดปกติแทน */ }
  const a = document.createElement('a');
  a.href = canvas.toDataURL('image/png');
  a.download = uid + '.png';
  a.click();
}
function stampRowHtml(p){
  const n = stampCount(p);
  const dots = ZONES.map(z=>{
    const done = p.stamps[z.id];
    return `<div class="stamp-dot">
      <div class="stamp-circ ${done?'done':''}" style="${done?`background:${z.hex};border-color:${z.hex};`:''}">${done?'✓':z.icon}</div>
      ${z.name}
    </div>`;
  }).join('');
  let unlock = '';
  if(n===ZONES.length){
    unlock = `<div class="unlock-box"><div class="t">🎉 ครบทุกโซนแล้ว!</div><div class="d">นำ QR นี้ไปรับของที่ระลึกและร่วมโหวตรางวัลได้ที่จุดรับของที่ระลึก</div></div>`;
  }
  return `<div class="stamp-row">${dots}</div><div class="progress-line">สะสมแล้ว ${n} / ${ZONES.length} โซน</div>${unlock}`;
}

let scanLock=false;
async function handleScanResult(uid){
  if(scanLock) return;
  scanLock = true;
  const p = await getParticipant(uid);
  if(!p){
    showStampToast(false, 'ไม่พบรหัส ' + uid.toUpperCase(), null);
    setTimeout(()=>{scanLock=false;}, 1200);
    return;
  }
  const zone = ZONES.find(z=>z.id===state.zone);
  const already = p.stamps[zone.id];
  if(already){
    showStampToast(true, `${p.name} — เคยประทับตราโซนนี้แล้ว`, zone, p);
    setTimeout(()=>{scanLock=false;}, 1600);
    return;
  }
  // New visit to this zone — ask which project impressed them most before stamping.
  pauseScanner();
  renderProjectPicker(p, zone);
}

  const zone = ZONES.find(z=>z.id===zoneId);
  try{
    const r = await apiPost({action:'stampZone', uid, zoneId, projectCode, category});

    resumeScannerAfterVote();

    showStampError(uid, zoneId, projectCode, (e&&e.message)||'ไม่ทราบสาเหตุ');
  }
}

          <option value="4">4 ดาว</option>
          <option value="3">3 ดาว</option>
          <option value="2">2 ดาว</option>

        </select>
      `).join('')}

  `;
}
// อ่านค่าแบบสอบถามจากฟอร์ม คืน null ถ้ายังตอบไม่ครบ (กันรับของ/เกียรติบัตรก่อนตอบแบบสอบถาม)
function readSatisfactionSurvey(){
  const ids = ['sv-q1','sv-q2','sv-q3','sv-q4','sv-q5'];
  const out = {};
  for(const id of ids){
    const v = document.getElementById(id).value;
    if(!v) return null;
    out[id] = Number(v);
  }
  return out;
}
async function finishRedeem(uid){
  const survey = readSatisfactionSurvey();
  if(!survey){ alert('กรุณาตอบแบบสอบถามความพึงพอใจให้ครบทั้ง 5 ข้อก่อนรับของที่ระลึก'); return; }
  const p = await getParticipant(uid);
  p.redeemed = true;
  p.satisfaction = JSON.stringify(survey);
  await saveParticipant(p);
  document.getElementById('redeem-result').innerHTML = `<div class="ok-box">🎁 บันทึกสำเร็จ! มอบของที่ระลึกให้ ${p.name} ได้เลย</div>`;
}

async function downloadSvQR(code){
  const canvas = document.querySelector('#sv-qrcode canvas');
  if(!canvas){ alert('ไม่พบ QR Code กรุณาลองใหม่อีกครั้ง'); return; }
  try{
    const blob = await new Promise(res => canvas.toBlob(res, 'image/png'));
    const file = new File([blob], code + '.png', { type: 'image/png' });
    if(navigator.canShare && navigator.canShare({ files: [file] })){
      await navigator.share({ files: [file], title: code });
      return;
    }
  }catch(e){ /* fallback below */ }
  const a = document.createElement('a');
  a.href = canvas.toDataURL('image/png');
  a.download = code + '.png';
  a.click();
}

// page's own web fonts) then wraps that image into a real A5-landscape PDF —
// sidesteps the need to embed a Thai font inside the PDF text layer itself.
// พื้นหลังเกียรติบัตรใช้ไฟล์ภาพร่วมกับกลุ่มอื่นๆ (ไม่ฝัง base64 ในหน้านี้ เพื่อไม่ให้หน้าเว็บหลักโตขึ้น
// — โหลดจากไฟล์แยกเฉพาะตอนสร้างเกียรติบัตรจริงเท่านั้น) ต้องอัปโหลดไฟล์ cert-bg-shared.jpg
// ไว้โฟลเดอร์เดียวกับ index.html บน GitHub Pages
const CERT_SHARED_BG_URL = './cert-bg-shared.jpg';

// แปลงเลขอารบิค 0-9 เป็นเลขไทย ๐-๙ ใช้กับเลขที่เกียรติบัตรให้เข้าชุดกับข้อความอื่นบนภาพ
function toThaiDigits(str){
  const thaiDigits = ['๐','๑','๒','๓','๔','๕','๖','๗','๘','๙'];
  return String(str).replace(/[0-9]/g, d => thaiDigits[+d]);
}
async function generateCertificate(r){
  // บังคับโหลดฟอนต์ SOVHuaHlam ให้จริงก่อนวาดลง canvas — document.fonts.ready อย่างเดียวไม่พอ
  // เพราะเบราว์เซอร์จะยังไม่โหลดฟอนต์จริงจนกว่าจะถูกใช้แสดงผลบน DOM ที่มองเห็นได้ก่อน
  try{
    await Promise.all([
      document.fonts.load('700 46px SOVHuaHlam'),
      document.fonts.load('700 26px SOVHuaHlam'),
      document.fonts.load('400 30px SOVHuaHlam'),
    ]);
    if(document.fonts.ready) await document.fonts.ready;
  }catch(e){}

  const W = 2000, H = 1412; // A4 แนวนอน ~170dpi ให้ตรงกับกลุ่มอื่นๆ
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  const bg = new Image();
  const bgLoaded = await new Promise((res)=>{ bg.onload=()=>res(true); bg.onerror=()=>res(false); bg.src = CERT_SHARED_BG_URL; });
  if(!bgLoaded) throw new Error('โหลดภาพพื้นหลังเกียรติบัตรไม่สำเร็จ (ตรวจสอบว่าอัปโหลดไฟล์ cert-bg-shared.jpg ไว้โฟลเดอร์เดียวกับเว็บแล้ว)');
  ctx.drawImage(bg, 0, 0, W, H);

  ctx.textBaseline = 'top';
  ctx.fillStyle = '#143C78';

  // recipient name — ตัวหนาพิเศษ, ปรับขนาดอัตโนมัติถ้าชื่อยาว
  // ตำแหน่งคำนวณให้อยู่กึ่งกลางพอดีระหว่างเส้น "แสดงว่า" (~y545) กับย่อหน้าด้านล่าง (~y720)
  let nameSize = 68;
  ctx.font = `700 ${nameSize}px SOVHuaHlam`;
  while (ctx.measureText(r.name).width > W - 400 && nameSize > 32) {
    nameSize -= 2;
    ctx.font = `700 ${nameSize}px SOVHuaHlam`;
  }
  ctx.textAlign = 'center';
  ctx.fillText(r.name, W/2, 572);

  let orgSize = 54;
  ctx.font = `700 ${orgSize}px SOVHuaHlam`;
  const institutionText = `สถาบัน: ${r.institution}`;
  while (ctx.measureText(institutionText).width > W - 300 && orgSize > 28) {
    orgSize -= 2;
    ctx.font = `700 ${orgSize}px SOVHuaHlam`;
  }
  ctx.fillText(institutionText, W/2, 642);

  // เลขที่เกียรติบัตร (มุมขวาบน) — แปลงจากเลขทะเบียน SV เดิมให้อยู่ในรูปแบบเดียวกับกลุ่มอื่นๆ
  // "กปท.ทม.นอกเมือง 000/2569" โดยไม่ต้องเรียก backend เพิ่ม เพราะเลขลำดับใน SV code
  // ก็เป็นเลขเรียงลำดับจริงอยู่แล้ว แค่แปลงรูปแบบการแสดงผล
  const certNoMatch = r.code.match(/SV(\d{4})-(\d+)/);
  const certNo = certNoMatch
    ? toThaiDigits(`กปท.ทม.นอกเมือง ${String(parseInt(certNoMatch[2],10)).padStart(3,'0')}/${parseInt(certNoMatch[1],10)+543}`)
    : r.code;
  ctx.textAlign = 'left';
  ctx.font = '400 44px SOVHuaHlam';
  ctx.fillText(certNo, 1490, 42);

  const imgData = canvas.toDataURL('image/jpeg', 0.95);
  if(!window.jspdf){ throw new Error('ไลบรารีสร้าง PDF โหลดไม่สำเร็จ (เช็คสัญญาณอินเทอร์เน็ต แล้วลองใหม่)'); }
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({ orientation:'landscape', unit:'mm', format:'a4' });
  pdf.addImage(imgData, 'JPEG', 0, 0, 297, 210);
  const fileName = `เกียรติบัตร-${r.code}.pdf`;
  // มือถือ (โดยเฉพาะ iOS Safari) มักดาวน์โหลดไฟล์ PDF แบบ data URI ของ jsPDF ไม่สำเร็จ/ไม่เสถียร
  // ลองใช้เมนูแชร์ของเครื่องก่อน (เหมือนปุ่มแชร์ QR) ถ้าไม่รองรับค่อย fallback เป็นดาวน์โหลดปกติ
  try{
    const pdfBlob = pdf.output('blob');
    const file = new File([pdfBlob], fileName, { type: 'application/pdf' });
    if(navigator.canShare && navigator.canShare({ files: [file] })){
      await navigator.share({ files: [file], title: fileName });
      return;
    }
  }catch(e){ /* ผู้ใช้กดยกเลิก หรือเบราว์เซอร์ไม่รองรับ — ใช้ดาวน์โหลดปกติแทน */ }
  pdf.save(fileName);
}

async function awardsSectionHtml(voteTallyOverall, list, voteCode, voteCategory){
  let saved = [];
  try{ saved = await apiGet({action:'getAwards'}); }catch(e){}
  const savedMap = {};
  saved.forEach(a=>{ savedMap[a.category] = a.projectCode; });

  const rankedOverall = voteTallyOverall.slice().sort((a,b)=>b.votes-a.votes);

  function tallyForCategory(catId){
    return PROJECTS.map(pj=>({
      ...pj,
      votes: list.filter(p=>{
        const v = p.votes && p.votes[pj.zoneId];
        return v && voteCode(v)===pj.code && voteCategory(v)===catId;
      }).length,
    })).sort((a,b)=>b.votes-a.votes);
  }

  return `
    <div class="zone-manager">
      <h3>🏅 สรุปผลรางวัล 5 ด้าน</h3>
      <p class="hint" style="margin-top:-4px;">4 ด้านแรกนับจากที่ผู้ร่วมงานเลือกด้านนั้นตรงๆ ตอนโหวตที่บูธ ส่วน "ขวัญใจมหาชน" นับจากยอดโหวตรวมทุกด้าน — กรรมการปรับเปลี่ยนตัวเลือกเองได้ก่อนบันทึก</p>
      ${AWARD_CATEGORIES.map(cat=>{
        const ranked = cat.id==='popular' ? rankedOverall : tallyForCategory(cat.id);
        const defaultCode = savedMap[cat.id] || (ranked[0] && ranked[0].votes>0 ? ranked[0].code : '');
        const options = ranked.map(pj=>`<option value="${pj.code}" data-name="${pj.name.replace(/"/g,'&quot;')}" ${pj.code===defaultCode?'selected':''}>${pj.code} — ${pj.name} (${pj.votes} โหวต${cat.id!=='popular'?'ด้านนี้':''})</option>`).join('');
        return `
        <label style="margin-top:10px;">${cat.label}</label>
        <select id="award-${cat.id}">
          <option value="" ${!defaultCode?'selected':''}>-- ยังไม่เลือก --</option>
          ${options}
        </select>
      `;
      }).join('')}
      <button class="btn btn-gold btn-block" style="margin-top:14px;" onclick="saveAwards()">บันทึกผลรางวัล</button>
      <div id="awards-save-status" class="hint"></div>
    </div>
  `;
}
async function saveAwards(){
  const statusEl = document.getElementById('awards-save-status');
  statusEl.innerHTML = 'กำลังบันทึก...';
  const data = AWARD_CATEGORIES.map(cat=>{
    const sel = document.getElementById('award-'+cat.id);
    const code = sel.value;
    const projectName = code ? (sel.selectedOptions[0].dataset.name || '') : '';
    return { category: cat.label, projectCode: code, projectName };
  }).filter(a=>a.projectCode);
  try{
    await apiPost({action:'saveAwards', pin: state.adminPin, data});
    statusEl.innerHTML = '<span style="color:var(--zone-env)">บันทึกผลรางวัลเรียบร้อยแล้ว</span>';
  }catch(e){
    statusEl.innerHTML = `<span style="color:var(--danger)">บันทึกไม่สำเร็จ: ${(e&&e.message)||'ไม่ทราบสาเหตุ'}</span>`;
  }
}

async function exportCsv(){
  const list = await listParticipants();
  const rows = [['uid','name','phone','affiliation','registeredAt', ...ZONES.map(z=>z.id), 'redeemed','satisfaction', ...ZONES.map(z=>'vote_'+z.id)]];
  list.forEach(p=>rows.push([p.uid,p.name,p.phone,p.affil,p.registeredAt, ...ZONES.map(z=>p.stamps[z.id]?1:0), p.redeemed?1:0, p.satisfaction||'', ...ZONES.map(z=>(p.votes&&p.votes[z.id])||'')]));
  const csv = rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob(["\uFEFF"+csv], {type:'text/csv;charset=utf-8;'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'health-passport-export.csv';
  a.click();
}
async function doResetZonesProjects(){
  if(!confirm('จะลบโซนและโครงการทั้งหมดที่มีอยู่ แล้วโหลดชุดข้อมูล 8 โซน 26 โครงการใหม่ทับ (ข้อมูลผู้เข้าร่วมงานจะไม่ถูกลบ) ยืนยันหรือไม่?')) return;
  try{
    await apiPost({action:'resetZonesAndProjects', pin: state.adminPin});
    zonesLoaded = false; projectsLoaded = false;
    await loadZones(); zonesLoaded = true;
    await loadProjects(); projectsLoaded = true;
    renderAdmin();
  }catch(e){
    alert('โหลดชุดข้อมูลไม่สำเร็จ: ' + ((e&&e.message)||'ไม่ทราบสาเหตุ') + '\n\nถ้าเพิ่งเปลี่ยน PIN ในชีต Config ให้ปิดแท็บนี้ เปิดลิงก์ใหม่ แล้ว login ด้วย PIN ล่าสุดอีกครั้ง');
  }
}

function zoneFormHtml(z){
  const editing = !!z;
  return `
    <div class="zone-form-box">
      <label>ชื่อโซน</label>
      <input type="text" id="zf-name" value="${editing?z.name:''}" placeholder="เช่น โซนอาหารปลอดภัย">
      <label>ไอคอน (พิมพ์อีโมจิ 1 ตัว)</label>
      <input type="text" id="zf-icon" value="${editing?z.icon:'⭐'}" maxlength="4">
      <label>สีประจำโซน</label>
      <input type="color" id="zf-color" value="${editing?z.hex:'#5B4B8A'}">
      <div class="toolbar">
        <button class="btn btn-primary" onclick="submitZone(${editing?`'${z.id}'`:'null'})">${editing?'บันทึกการแก้ไข':'เพิ่มโซนนี้'}</button>
        <button class="btn btn-outline" onclick="closeZoneForm()">ยกเลิก</button>
      </div>
    </div>
  `;
}
function openAddZone(){ document.getElementById('zone-form-area').innerHTML = zoneFormHtml(null); }
function openEditZone(id){ const z = ZONES.find(x=>x.id===id); document.getElementById('zone-form-area').innerHTML = zoneFormHtml(z); }
function closeZoneForm(){ document.getElementById('zone-form-area').innerHTML = `<button class="btn btn-outline" style="margin-top:12px;" onclick="openAddZone()">+ เพิ่มโซนใหม่</button>`; }
async function submitZone(id){
  const name = document.getElementById('zf-name').value.trim();
  const icon = document.getElementById('zf-icon').value.trim() || '⭐';
  const hex = document.getElementById('zf-color').value;
  if(!name){ return; }
  if(id){
    const z = ZONES.find(x=>x.id===id);
    z.name = name; z.icon = icon; z.hex = hex;
  } else {
    ZONES.push({ id:'z'+Date.now().toString(36), name, icon, hex });
  }
  try{ await persistZones(); renderAdmin(); }
  catch(e){ alert('บันทึกไม่สำเร็จ: ' + ((e&&e.message)||'ไม่ทราบสาเหตุ')); }
}
async function removeZone(id){
  if(!confirm('ยืนยันลบโซนนี้? ผู้เข้าร่วมที่เคยได้ตราประทับโซนนี้จะยังมีข้อมูลอยู่ แต่โซนนี้จะไม่ปรากฏให้สแกนอีกต่อไป')) return;
  ZONES = ZONES.filter(z=>z.id!==id);
  try{ await persistZones(); renderAdmin(); }
  catch(e){ alert('ลบไม่สำเร็จ: ' + ((e&&e.message)||'ไม่ทราบสาเหตุ')); }
}

function projectFormHtml(pj){
  const editing = !!pj;
  return `
    <div class="zone-form-box">
      <label>โซน</label>
      <select id="pf-zone">${ZONES.map(z=>`<option value="${z.id}" ${editing && pj.zoneId===z.id?'selected':''}>${z.icon} ${z.name}</option>`).join('')}</select>
      <label>รหัสโครงการ</label>
      <input type="text" id="pf-code" value="${editing?pj.code:''}" placeholder="เช่น PW104" ${editing?'disabled':''} style="text-transform:uppercase;">
      <label>ชื่อโครงการ</label>
      <input type="text" id="pf-name" value="${editing?pj.name.replace(/"/g,'&quot;'):''}" placeholder="ชื่อโครงการเต็ม">
      <div class="toolbar">
        <button class="btn btn-primary" onclick="submitProject(${editing?`'${pj.code}'`:'null'})">${editing?'บันทึกการแก้ไข':'เพิ่มโครงการนี้'}</button>
        <button class="btn btn-outline" onclick="closeProjectForm()">ยกเลิก</button>
      </div>
    </div>
  `;
}
function openAddProject(){ document.getElementById('project-form-area').innerHTML = projectFormHtml(null); }
function openEditProject(code){ const pj = PROJECTS.find(x=>x.code===code); document.getElementById('project-form-area').innerHTML = projectFormHtml(pj); }
function closeProjectForm(){ document.getElementById('project-form-area').innerHTML = `<button class="btn btn-outline" style="margin-top:12px;" onclick="openAddProject()">+ เพิ่มโครงการใหม่</button>`; }
async function submitProject(code){
  const zoneId = document.getElementById('pf-zone').value;
  const newCode = code || document.getElementById('pf-code').value.trim().toUpperCase();
  const name = document.getElementById('pf-name').value.trim();
  if(!newCode || !name){ return; }
  if(code){
    const pj = PROJECTS.find(x=>x.code===code);
    pj.zoneId = zoneId; pj.name = name;
  } else {
    if(PROJECTS.some(x=>x.code===newCode)){ alert('มีรหัสโครงการนี้อยู่แล้ว'); return; }
    PROJECTS.push({ code:newCode, zoneId, name });
  }
  try{ await persistProjects(); renderAdmin(); }
  catch(e){ alert('บันทึกไม่สำเร็จ: ' + ((e&&e.message)||'ไม่ทราบสาเหตุ')); }
}
async function removeProject(code){
  if(!confirm('ยืนยันลบโครงการนี้?')) return;
  PROJECTS = PROJECTS.filter(x=>x.code!==code);
  try{ await persistProjects(); renderAdmin(); }
  catch(e){ alert('ลบไม่สำเร็จ: ' + ((e&&e.message)||'ไม่ทราบสาเหตุ')); }
}

render();
</script>
